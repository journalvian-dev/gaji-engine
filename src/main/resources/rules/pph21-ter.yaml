# PPh 21 monthly withholding — TER (Tarif Efektif Rata-rata)
#
# Source : PP 58/2023, Lampiran huruf A, B dan C
# Status : effective 1 January 2024. Unchanged since.
#
# Transcription note
# ------------------
# The tables below were transcribed from the official Lampiran PP 58/2023 as
# published by DJP (pajak.go.id). They were NOT derived from a formula, because
# TER is not a formula: it is a simplified rate table that deliberately rounds
# away the exact annualised result. The December reconciliation exists to
# correct the difference.
#
# Sanity check performed: PP 58/2023's own worked example uses Tuan R with a
# monthly gross of Rp10.000.000 and PTKP K/0, and states "tarif efektif 2%
# (Tabel A baris 9)". In the table below, TER A layer 9 covers
# Rp9.650.001–Rp10.050.000 at 2.00%. Matches.
#
# How it works
# ------------
# For months January–November, PPh 21 = monthly gross x TER rate for the
# employee's category.
#
# December is different: the annual progressive calculation (Pasal 17) is
# applied to the full year, then the amount already withheld in January–November
# is subtracted. That is the annual reconciliation step, and it is why the
# December figure is usually not equal to the other eleven months.
#
# Category is determined by PTKP status at the start of the tax year.
#
# `upTo` is the inclusive ceiling of the layer, in rupiah of monthly gross.
# The final layer of each table is unbounded, expressed as `upTo: null`.
#
# Dates are quoted so they are loaded as strings, not as java.util.Date.

