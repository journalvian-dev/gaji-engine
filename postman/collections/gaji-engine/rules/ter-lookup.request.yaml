$kind: http-request
name: 'TER rate: the PP 58/2023 worked example'
method: GET
url: '{{baseUrl}}/api/v1/rules/ter?date=2026-01-01&status=K/0&gross=10000000'
order: 3000
queryParams:
  - key: date
    value: '2026-01-01'
  - key: status
    value: 'K/0'
  - key: gross
    value: '10000000'
    description: Tuan R's monthly gross in the regulation's own example.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();

      pm.test('200 OK', () => pm.response.to.have.status(200));

      pm.test('K/0 maps to TER category A', () => {
          pm.expect(body.category).to.eql('A');
      });

      pm.test('Rp 10.000.000 falls in a 2% layer - PP 58/2023, Tabel A baris 9', () => {
          pm.expect(body.rate).to.eql(0.02);
      });

      pm.test('so the monthly withholding is Rp 200.000', () => {
          pm.expect(body.withholding).to.eql(200000);
      });

      pm.test('the layer ceiling is reported, not just the rate', () => {
          pm.expect(body.layerCeiling).to.eql(10050000);
      });
